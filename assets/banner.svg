<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #f8fafc;
    }

    /* CSS Keyframe Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes float-slide-1 {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(0deg); }
    }
    @keyframes float-slide-2 {
      0%, 100% { transform: translateY(0px) rotate(3deg); }
      50% { transform: translateY(-15px) rotate(1deg); }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(15px); }
    }
    @keyframes wave-bg {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }

    .anim-pulse {
      animation: pulse-glow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .anim-slide-1 {
      animation: float-slide-1 7s ease-in-out infinite;
      transform-origin: center;
    }
    .anim-slide-2 {
      animation: float-slide-2 9s ease-in-out infinite;
      transform-origin: center;
    }
    .anim-pill {
      animation: float-pill 8s ease-in-out infinite;
    }
    .animated-wave {
      stroke-dasharray: 20 10;
      animation: wave-bg 30s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Background Orbs / Glows -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" opacity="0.25" class="anim-pulse" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="220" fill="#a855f7" opacity="0.2" class="anim-pulse" filter="url(#glow)" />

  <!-- Animated Decorative Grid Waves in Background -->
  <path d="M-50 260 Q 300 180, 600 240 T 1250 200" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.3" class="animated-wave" />
  <path d="M-50 280 Q 350 220, 700 280 T 1250 220" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" class="animated-wave" />

  <!-- Right Floating Decorative Deck Cards (Behind foreground text, safely positioned) -->
  <g transform="translate(860, 40)" class="anim-slide-1" filter="url(#card-shadow)">
    <rect width="240" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.85" />
    <rect x="20" y="25" width="120" height="12" rx="4" fill="#818cf8" />
    <rect x="20" y="48" width="180" height="8" rx="3" fill="#64748b" />
    <rect x="20" y="64" width="140" height="8" rx="3" fill="#64748b" />
    <rect x="20" y="88" width="60" height="40" rx="6" fill="#38bdf8" opacity="0.8" />
    <rect x="90" y="88" width="60" height="40" rx="6" fill="#c084fc" opacity="0.8" />
  </g>

  <g transform="translate(940, 110)" class="anim-slide-2" filter="url(#card-shadow)">
    <rect width="220" height="140" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="2" opacity="0.9" />
    <rect x="20" y="22" width="100" height="10" rx="4" fill="url(#accent-grad)" />
    <circle cx="170" cy="70" r="30" fill="none" stroke="#f472b6" stroke-width="4" opacity="0.7" />
    <path d="M 170 70 L 170 50 A 20 20 0 0 1 190 70 Z" fill="#f472b6" opacity="0.9" />
    <rect x="20" y="45" width="120" height="6" rx="3" fill="#94a3b8" />
    <rect x="20" y="58" width="100" height="6" rx="3" fill="#94a3b8" />
    <rect x="20" y="71" width="80" height="6" rx="3" fill="#94a3b8" />
  </g>

  <!-- Animated Floating Category Pills (Positioned safely) -->
  <g transform="translate(60, 248)" class="anim-pill">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text x="75" y="21" text-anchor="middle" class="badge-text">📊 Live Polling</text>
  </g>

  <g transform="translate(225, 248)" class="anim-pill">
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#581c87" stroke="#a855f7" stroke-width="1" />
    <text x="82.5" y="21" text-anchor="middle" class="badge-text">🔍 Spatial Storytelling</text>
  </g>

  <g transform="translate(405, 248)" class="anim-pill">
    <rect x="0" y="0" width="175" height="32" rx="16" fill="#831843" stroke="#f472b6" stroke-width="1" />
    <text x="87.5" y="21" text-anchor="middle" class="badge-text">⚡ Markdown &amp; Code</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Crystal Clear & Unobscured) -->
  <g transform="translate(60, 85)">
    <!-- Main Icon Badge -->
    <g transform="translate(0, -35)">
      <rect width="44" height="44" rx="10" fill="url(#accent-grad)" />
      <path d="M14 13 h16 v18 h-16 z M18 9 h16 v4 h-16 z" fill="#ffffff" opacity="0.9" />
      <path d="M12 28 l6 -6 l4 4 l8 -8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <text x="58" y="0" class="title">Awesome Interactive Presentation</text>
    <text x="0" y="45" class="subtitle">A Curated Ecosystem of SaaS Platforms, Live Polling Tools &amp; Open-Source Slide Frameworks</text>
  </g>
</svg>
